<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/brand/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary Meta Tags -->
    <title>Readers of Aurangabad | The City Reading Collective</title>
    <meta name="title" content="Readers of Aurangabad | The City Reading Collective" />
    <meta name="description" content="Readers of Aurangabad is a contemporary reading community in MH20. Bring a book, meet people, and be part of real offline reading meetups in Chhatrapati Sambhajinagar." />
    <meta name="author" content="Readers of Aurangabad" />
    <link rel="canonical" href="https://readersofaurangabad.com/" />
    <script>
      // Prevent Vercel preview deployments from competing with canonical production domain
      if (window.location.hostname.includes('vercel.app') && !window.location.hostname.includes('readersofaurangabad.com')) {
        const meta = document.createElement('meta');
        meta.name = 'robots';
        meta.content = 'noindex, nofollow';
        document.head.appendChild(meta);
      }
    </script>

    <!-- Open Graph / Social Sharing -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://readersofaurangabad.com/" />
    <meta property="og:title" content="Readers of Aurangabad | The City Reading Collective" />
    <meta property="og:description" content="A contemporary reading community in Aurangabad (MH20). Real people, real books, real conversations." />
    <meta property="og:image" content="https://readersofaurangabad.com/images/enhanced/hero/roa-group-hero-clean.webp" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://readersofaurangabad.com/" />
    <meta property="twitter:title" content="Readers of Aurangabad | The City Reading Collective" />
    <meta property="twitter:description" content="A contemporary reading community in Aurangabad (MH20). Real people, real books, real conversations." />
    <meta property="twitter:image" content="https://readersofaurangabad.com/images/enhanced/hero/roa-group-hero-clean.webp" />

    <!-- Fonts: Archivo Black display, DM Sans interface, Fraunces editorial contrast, regional scripts. -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400;1,9..40,500&family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&family=Noto+Nastaliq+Urdu:wght@400;700&family=Noto+Serif+Devanagari:wght@400;600;700&display=swap" rel="stylesheet">

    <meta name="theme-color" content="#F5F4EF" id="meta-theme-color" />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('roa-theme');
          var isDark = saved === 'dark' || (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.toggle('dark', isDark);
          document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
          var meta = document.getElementById('meta-theme-color');
          if (meta) meta.setAttribute('content', isDark ? '#171717' : '#F5F4EF');
        } catch (e) {}
      })();
    </script>

    <!-- Structured Data (JSON-LD) for Local Community & Literary Organization -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Community",
      "name": "Readers of Aurangabad",
      "alternateName": "Readers of MH20",
      "url": "https://readersofaurangabad.com",
      "logo": "https://readersofaurangabad.com/brand/logo.png",
      "description": "A community-driven reading movement based in Aurangabad (Chhatrapati Sambhajinagar), Maharashtra, India. Bringing people, books, ideas, and stories together.",
      "founder": {
        "@type": "Person",
        "name": "Abdul Rafe Farooqui",
        "jobTitle": "Founder"
      },
      "address": {
        "@type": "PostalAddress",
        "addressLocality": "Aurangabad",
        "addressRegion": "Maharashtra",
        "postalCode": "431001",
        "addressCountry": "IN"
      },
      "sameAs": [
        "https://www.instagram.com/readers.of.aurangabad/"
      ]
    }
    </script>

    <style>
      #initial-loader {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: grid;
        place-items: center;
        padding: 2rem;
        background: #F5F4EF;
        color: #171717;
        transition: opacity 0.35s ease;
        font-family: 'DM Sans', system-ui, sans-serif;
      }
      html.dark #initial-loader,
      html[data-theme="dark"] #initial-loader {
        background: #171717;
        color: #F5F4EF;
      }
      .init-mark {
        width: min(92vw, 520px);
        padding: 1.5rem 0;
        border-top: 2px solid #171717;
        border-bottom: 2px solid #171717;
        text-align: left;
      }
      html.dark .init-mark, html[data-theme="dark"] .init-mark { border-color: #F5F4EF; }
      .init-overline {
        display: block;
        color: #315BFF;
        font-size: 0.68rem;
        font-weight: 700;
        letter-spacing: 0.22em;
        text-transform: uppercase;
      }
      .init-title {
        margin: 0.75rem 0 0.25rem;
        font-family: 'Archivo Black', 'Arial Black', sans-serif;
        font-size: clamp(2.4rem, 8vw, 4.2rem);
        font-weight: 400;
        line-height: 0.92;
        letter-spacing: -0.03em;
        text-transform: uppercase;
      }
      .init-subtitle {
        margin: 0.75rem 0 0;
        color: #666660;
        font-size: 0.72rem;
        font-weight: 700;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }
      html.dark .init-subtitle, html[data-theme="dark"] .init-subtitle { color: #A8A8A0; }
      .init-line {
        width: 64px;
        height: 3px;
        margin-top: 1.5rem;
        background: #315BFF;
        transform-origin: left center;
        animation: initRule 1.4s ease-in-out infinite;
      }
      @keyframes initRule {
        0%, 100% { transform: scaleX(0.35); opacity: 0.5; }
        50% { transform: scaleX(1); opacity: 1; }
      }
      html.dark body, html[data-theme="dark"] body { background: #171717; color: #F5F4EF; }
      @media (prefers-reduced-motion: reduce) { .init-line { animation: none; transform: scaleX(1); opacity: 1; } }
    </style>
  </head>
  <body class="bg-[#F5F4EF] text-[#171717] antialiased">
    <div id="initial-loader" role="status" aria-live="polite" aria-label="Loading Readers of Aurangabad">
      <div class="init-mark">
        <span class="init-overline">MH20 / Chhatrapati Sambhajinagar</span>
        <h2 class="init-title">Read.<br>Meet.<br>Repeat.</h2>
        <p class="init-subtitle">Readers of Aurangabad</p>
        <span class="init-line" aria-hidden="true"></span>
      </div>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
